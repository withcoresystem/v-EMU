# gpgcheck = true
# gpgkeys = ["https://download1.rpmfusion.org/nonfree/fedora/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020"]
# enabled = true
# ---------------------------------------------------------------------------
# Optional: firstboot debloat
#
# Runs once at first boot, not at build time. Uncomment and edit the list.
# The image still contains these packages until the first boot finishes.
#
# [[customizations.firstboot.scripts]]
# type = "custom"
# name = "vemu-debloat"
# ignore_failure = true
# contents = """
# #!/bin/bash
# set -u
# LOG=/var/log/vemu-debloat.log
# exec >>"$LOG" 2>&1
# DEBLOAT="gnome-tour gnome-weather cheese rhythmbox totem"
# REMOVE=""
# for p in $DEBLOAT; do
#   rpm -q "$p" >/dev/null 2>&1 && REMOVE="$REMOVE $p"
# done
# [ -n "$REMOVE" ] && dnf -y --disablerepo='*' remove $REMOVE || true
# touch /var/lib/vemu/debloat.done
# """

# QEMU-optimized: remove firmware not used by virtual hardware on first boot.
[[customizations.files]]
path = "/usr/local/sbin/vemu-debloat"
data = "#!/bin/bash\nset -u\nLOG=/var/log/vemu-debloat.log\nexec >>\"$LOG\" 2>&1\necho \"vEMU debloat start $(date -Is)\"\nFIRMWARE=$(rpm -qa --qf '%{NAME}\\n' | grep -- '-firmware$' || true)\nWHENCE=$(rpm -qa --qf '%{NAME}\\n' | grep '^linux-firmware-whence$' || true)\nMICROCODE=\"\"\nrpm -q microcode_ctl >/dev/null 2>&1 && MICROCODE=microcode_ctl\nEXTRA=\"\"\nfor p in kdump-utils mcelog; do\n    rpm -q \"$p\" >/dev/null 2>&1 && EXTRA=\"$EXTRA $p\"\ndone\nREMOVE=$(printf '%s\\n%s\\n%s\\n%s\\n' \"$FIRMWARE\" \"$WHENCE\" \"$MICROCODE\" \"$EXTRA\" | tr '\\n' ' ')\nif [ -n \"${REMOVE// /}\" ]; then\n    echo \"Removing:$REMOVE\"\n    dnf -y --disablerepo='*' remove $REMOVE || echo \"dnf remove failed: $?\"\nelse\n    echo \"No firmware packages found\"\nfi\nsystemctl reset-failed kdump.service mcelog.service 2>/dev/null || true\ntouch /var/lib/vemu/debloat.done\necho \"vEMU debloat done $(date -Is)\"\n"
mode = "0755"

[[customizations.files]]
path = "/etc/systemd/system/vemu-debloat.service"
data = "[Unit]\nDescription=Remove firmware not used by QEMU virtual hardware\nConditionPathExists=!/var/lib/vemu/debloat.done\nAfter=local-fs.target\n\n[Service]\nType=oneshot\nStateDirectory=vemu\nExecStart=/usr/local/sbin/vemu-debloat\nRemainAfterExit=yes\n\n[Install]\nWantedBy=multi-user.target\n"
mode = "0644"
