# vEMU QEMU-optimized variant. Generated from blueprint.toml.
# The firstboot unit removes firmware packages unused by QEMU/KVM.
# Keep this file in sync when editing the full blueprint.

# vEMU desktop template — RHEL-like KDE (AlmaLinux 10.2, qcow2)
#
# Build:
#   image-builder manifest qcow2 --distro almalinux-10.2 --blueprint blueprint.toml \
#     --extra-repo https://repo.almalinux.org/almalinux/10.2/CRB/x86_64/os/ \
#     --extra-repo https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/
#   image-builder build qcow2 --distro almalinux-10.2 \
#     --blueprint blueprint.toml --output-dir ./out \
#     --extra-repo https://repo.almalinux.org/almalinux/10.2/CRB/x86_64/os/ \
#     --extra-repo https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/
#
# For Rocky/CentOS/Oracle, change distro to the matching image-builder name.
# RHEL itself needs subscription/entitlement and is not a 0.2.0 target.
#
# AlmaLinux base does not ship KDE; EPEL and CRB are required. Delete the KDE
# package list only if you switch to a RHEL-like base that already provides it.

name = "vemu-rhel-like-kde-qemu"
description = "Minimal RHEL-like KDE desktop for vEMU labs"
version = "1.0.0"
distro = "almalinux-10.2"

# KDE does not fit in the default 2 GiB root partition.
[[customizations.filesystem]]
mountpoint = "/"
minsize = 12884901888

[[packages]]
name = "plasma-desktop"
version = "*"

[[packages]]
name = "plasma-workspace"
version = "*"

[[packages]]
name = "sddm"
version = "*"

[[packages]]
name = "sddm-breeze"
version = "*"

[[packages]]
name = "sddm-wayland-plasma"
version = "*"

[[packages]]
name = "kde-settings"
version = "*"

[[packages]]
name = "kde-settings-sddm"
version = "*"

[[packages]]
name = "plasma-nm"
version = "*"

[[packages]]
name = "plasma-pa"
version = "*"

[[packages]]
name = "dolphin"
version = "*"

[[packages]]
name = "konsole"
version = "*"

[[packages]]
name = "ark"
version = "*"

[[packages]]
name = "spectacle"
version = "*"

[[packages]]
name = "plasma-integration"
version = "*"

[[packages]]
name = "breeze-icon-theme"
version = "*"

[[packages]]
name = "plasma-breeze"
version = "*"

[[packages]]
name = "kdeplasma-addons"
version = "*"

[[packages]]
name = "kde-gtk-config"
version = "*"

[[packages]]
name = "kde-cli-tools"
version = "*"

[[packages]]
name = "kdesu"
version = "*"

[[packages]]
name = "qt6-qtwayland"
version = "*"

[[packages]]
name = "firefox"
version = "*"

[[packages]]
name = "openssh-server"
version = "*"

[[packages]]
name = "qemu-guest-agent"
version = "*"

# Required for customizations.locale.languages = ["en_US.UTF-8"].
[[packages]]
name = "glibc-langpack-en"
version = "*"

[[packages]]
name = "almalinux-backgrounds"
version = "*"

[[packages]]
name = "plasma-workspace-wallpapers"
version = "*"

[[packages]]
name = "qt6-qtimageformats"
version = "*"

[customizations]
hostname = "vemu-rhel-like-kde"

[customizations.timezone]
timezone = "UTC"
# ntpservers = ["0.pool.ntp.org", "1.pool.ntp.org"]

[customizations.locale]
languages = ["en_US.UTF-8"]
keyboard = "us"

[customizations.services]
enabled = ["sshd", "qemu-guest-agent", "sddm", "vemu-graphical-default.service", "vemu-debloat.service"]

# Boot graphical with the kernel argument; the systemd unit below persists the
# default target on first boot.
[customizations.kernel]
append = "systemd.unit=graphical.target"

# PackageKit can exceed its default 45s start timeout on a slow first boot.
[[customizations.directories]]
path = "/etc/systemd/system/packagekit.service.d"

[[customizations.files]]
path = "/etc/systemd/system/packagekit.service.d/10-vemu-timeout.conf"
data = "[Unit]\nAfter=network-online.target\n\n[Service]\nTimeoutStartSec=180\n"
mode = "0644"

# Default lab account. Change the hash before sharing the image.
# Generate a new one with: openssl passwd -6
[[customizations.user]]
name = "lab"
password = "$6$PV5Tnck0Y5T/B.2J$vUWY6meG9.7xZa20THF.WoRxxCaXQLo0v.o6KW/QVbZ789jUJQ9rAftqr5dM/E186Up3x8rEKjqqqR/T9GPMt."
groups = ["wheel"]
# key = "ssh-ed25519 AAAA... user@example"

[[customizations.directories]]
path = "/etc/sddm.conf.d"

[[customizations.files]]
path = "/etc/sddm.conf.d/kde_settings.conf"
data = "[Theme]\nCurrent=breeze\n"
mode = "0644"

[[customizations.files]]
path = "/etc/plasma-setup-done"
data = "Image Builder: Plasma Setup already applied\n"
mode = "0644"

# Persist the graphical default target with a systemd oneshot unit. This works
# on image-builder 52 (AlmaLinux 10.2) as well as newer releases; the older CLI
# rejects customizations.firstboot and customizations.services.default_target.
[[customizations.files]]
path = "/etc/systemd/system/vemu-graphical-default.service"
data = "[Unit]\nDescription=Persist the vEMU graphical default target\nConditionPathExists=!/var/lib/vemu/graphical-default.done\nAfter=local-fs.target\n\n[Service]\nType=oneshot\nStateDirectory=vemu\nExecStart=/usr/bin/systemctl set-default graphical.target\nExecStart=/usr/bin/touch /var/lib/vemu/graphical-default.done\nRemainAfterExit=yes\n\n[Install]\nWantedBy=multi-user.target\n"
mode = "0644"

# Required for AlmaLinux KDE: EPEL provides Plasma, CRB provides missing
# build/runtime dependencies. These are also passed with --extra-repo above.
[[customizations.repositories]]
id = "vemu-crb"
name = "AlmaLinux 10.2 CRB"
baseurls = ["https://repo.almalinux.org/almalinux/10.2/CRB/x86_64/os/"]
gpgcheck = true
gpgkeys = ["https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux-10"]
enabled = true

[[customizations.repositories]]
id = "epel"
name = "Extra Packages for Enterprise Linux 10"
baseurls = ["https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/"]
gpgcheck = true
gpgkeys = ["https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-10"]
enabled = true

