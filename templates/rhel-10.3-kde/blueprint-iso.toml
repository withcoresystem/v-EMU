name = "vemu-rhel-10.3-kde-iso"
description = "RHEL 10.3 KDE Plasma installer ISO for vEMU labs (EPEL + CRB)"
version = "1.0.0"
distro = "rhel-10.3"

[[groups]]
name = "kde-desktop"

[[packages]]
name = "konsole"
version = "*"

[[packages]]
name = "dolphin"
version = "*"

[[packages]]
name = "qemu-guest-agent"
version = "*"

[[packages]]
name = "glibc-langpack-en"
version = "*"

[[packages]]
name = "dejavu-sans-fonts"
version = "*"

[[packages]]
name = "ansible-core"
version = "*"

[[packages]]
name = "git"
version = "*"

[[packages]]
name = "vim-enhanced"
version = "*"

[[packages]]
name = "bash-completion"
version = "*"

[[packages]]
name = "rsync"
version = "*"

[[packages]]
name = "tar"
version = "*"

[[packages]]
name = "bzip2"
version = "*"

[[packages]]
name = "xz"
version = "*"

[[packages]]
name = "nfs-utils"
version = "*"

[[packages]]
name = "autofs"
version = "*"

[[packages]]
name = "lvm2"
version = "*"

[[packages]]
name = "policycoreutils-python-utils"
version = "*"

[[packages]]
name = "setools-console"
version = "*"

[customizations.timezone]
timezone = "UTC"

[customizations.locale]
languages = ["en_US.UTF-8"]
keyboard = "us"

[[customizations.directories]]
path = "/etc/systemd/system/packagekit.service.d"

[[customizations.files]]
path = "/etc/systemd/system/packagekit.service.d/10-vemu-timeout.conf"
data = "[Unit]\nAfter=network-online.target\n\n[Service]\nTimeoutStartSec=180\n"
mode = "0644"

[[customizations.repositories]]
id = "epel"
name = "Extra Packages for Enterprise Linux 10"
baseurls = ["https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/"]
gpgcheck = true
gpgkeys = ["https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-10"]
enabled = true

[[customizations.files]]
path = "/etc/NetworkManager/system-connections/vemu-ethernet.nmconnection"
data = "[connection]\nid=vemu-ethernet\ntype=ethernet\nautoconnect=true\n\n[ipv4]\nmethod=auto\n\n[ipv6]\nmethod=auto\n"
mode = "0600"

[[packages]]
name = "python3"
version = "*"

[[packages]]
name = "plymouth"
version = "*"

[[packages]]
name = "plymouth-scripts"
version = "*"

[[packages]]
name = "plymouth-plugin-two-step"
version = "*"
