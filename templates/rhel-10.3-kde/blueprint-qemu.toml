# vEMU QEMU-optimized variant. Generated from blueprint.toml.
# The firstboot unit removes firmware packages unused by QEMU/KVM.

name = "vemu-rhel-10.3-kde-qemu"
description = "RHEL 10.3 KDE Plasma for vEMU labs (EPEL + CRB)"
version = "1.0.0"
distro = "rhel-10.3"

[[customizations.filesystem]]
mountpoint = "/"
minsize = 12884901888

[[groups]]
name = "kde-desktop"

[[packages]]
name = "konsole"
version = "*"

[[packages]]
name = "dolphin"
version = "*"

[[packages]]
name = "qemu-guest-agent"
version = "*"

[[packages]]
name = "glibc-langpack-en"
version = "*"

[[packages]]
name = "dejavu-sans-fonts"
version = "*"

[[packages]]
name = "ansible-core"
version = "*"

[[packages]]
name = "git"
version = "*"

[[packages]]
name = "vim-enhanced"
version = "*"

[[packages]]
name = "bash-completion"
version = "*"

[[packages]]
name = "rsync"
version = "*"

[[packages]]
name = "tar"
version = "*"

[[packages]]
name = "bzip2"
version = "*"

[[packages]]
name = "xz"
version = "*"

[[packages]]
name = "nfs-utils"
version = "*"

[[packages]]
name = "autofs"
version = "*"

[[packages]]
name = "lvm2"
version = "*"

[[packages]]
name = "policycoreutils-python-utils"
version = "*"

[[packages]]
name = "setools-console"
version = "*"

[customizations]
hostname = "vemu-rhel-10.3-kde"

[customizations.timezone]
timezone = "UTC"

[customizations.locale]
languages = ["en_US.UTF-8"]
keyboard = "us"

[customizations.services]
enabled = ["sshd", "qemu-guest-agent", "plasmalogin", "vemu-graphical-default.service", "vemu-debloat.service"]

[customizations.kernel]
append = "systemd.unit=graphical.target"

[[customizations.directories]]
path = "/etc/systemd/system/packagekit.service.d"

[[customizations.files]]
path = "/etc/systemd/system/packagekit.service.d/10-vemu-timeout.conf"
data = "[Unit]\nAfter=network-online.target\n\n[Service]\nTimeoutStartSec=180\n"
mode = "0644"

[[customizations.user]]
name = "lab"
password = "$6$PV5Tnck0Y5T/B.2J$vUWY6meG9.7xZa20THF.WoRxxCaXQLo0v.o6KW/QVbZ789jUJQ9rAftqr5dM/E186Up3x8rEKjqqqR/T9GPMt."
groups = ["wheel"]

# RHEL 10.3 does not ship KDE. EPEL provides Plasma, CRB provides build
# dependencies. On a registered RHEL host, enable CRB:
#   subscription-manager repos --enable codeready-builder-for-rhel-10-x86_64-rpms
# image-builder 79 does not include CRB in its default repo data; use the
# repository override documented in this template's README.
[[customizations.repositories]]
id = "epel"
name = "Extra Packages for Enterprise Linux 10"
baseurls = ["https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/"]
gpgcheck = true
gpgkeys = ["https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-10"]
enabled = true

[[customizations.files]]
path = "/etc/NetworkManager/system-connections/vemu-ethernet.nmconnection"
data = "[connection]\nid=vemu-ethernet\ntype=ethernet\nautoconnect=true\n\n[ipv4]\nmethod=auto\n\n[ipv6]\nmethod=auto\n"
mode = "0600"

[[customizations.files]]
path = "/etc/systemd/system/vemu-graphical-default.service"
data = "[Unit]\nDescription=Persist the vEMU graphical default target\nConditionPathExists=!/var/lib/vemu/graphical-default.done\nAfter=local-fs.target\n\n[Service]\nType=oneshot\nStateDirectory=vemu\nExecStart=/usr/bin/systemctl set-default graphical.target\nExecStart=/usr/bin/touch /var/lib/vemu/graphical-default.done\nRemainAfterExit=yes\n\n[Install]\nWantedBy=multi-user.target\n"
mode = "0644"

# QEMU-optimized: remove firmware not used by virtual hardware on first boot.
[[customizations.files]]
path = "/usr/local/sbin/vemu-debloat"
data = "#!/bin/bash\nset -u\nLOG=/var/log/vemu-debloat.log\nexec >>\"$LOG\" 2>&1\necho \"vEMU debloat start $(date -Is)\"\nFIRMWARE=$(rpm -qa --qf '%{NAME}\\n' | grep -- '-firmware$' || true)\nWHENCE=$(rpm -qa --qf '%{NAME}\\n' | grep '^linux-firmware-whence$' || true)\nMICROCODE=\"\"\nrpm -q microcode_ctl >/dev/null 2>&1 && MICROCODE=microcode_ctl\nEXTRA=\"\"\nfor p in kdump-utils mcelog; do\n    rpm -q \"$p\" >/dev/null 2>&1 && EXTRA=\"$EXTRA $p\"\ndone\nREMOVE=$(printf '%s\\n%s\\n%s\\n%s\\n' \"$FIRMWARE\" \"$WHENCE\" \"$MICROCODE\" \"$EXTRA\" | tr '\\n' ' ')\nif [ -n \"${REMOVE// /}\" ]; then\n    echo \"Removing:$REMOVE\"\n    dnf -y --disablerepo='*' remove $REMOVE || echo \"dnf remove failed: $?\"\nelse\n    echo \"No firmware packages found\"\nfi\nsystemctl reset-failed kdump.service mcelog.service 2>/dev/null || true\ntouch /var/lib/vemu/debloat.done\necho \"vEMU debloat done $(date -Is)\"\n"
mode = "0755"

[[customizations.files]]
path = "/etc/systemd/system/vemu-debloat.service"
data = "[Unit]\nDescription=Remove firmware not used by QEMU virtual hardware\nConditionPathExists=!/var/lib/vemu/debloat.done\nAfter=local-fs.target\n\n[Service]\nType=oneshot\nStateDirectory=vemu\nExecStart=/usr/local/sbin/vemu-debloat\nRemainAfterExit=yes\n\n[Install]\nWantedBy=multi-user.target\n"
mode = "0644"
